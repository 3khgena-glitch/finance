<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Облік</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dashboard" class="page active">
        <div class="header-info">
            <div id="current-date"></div>
            <div class="balance-block">
                <div class="balance-label">Сьогодні - Залишок</div>
                <div id="balance-amount" class="balance-amount">0 ₴</div>
            </div>
        </div>

        <div class="card add-form">
            <input type="date" id="input-date">
            <div class="segmented-control">
                <input type="radio" name="type" id="type-expense" value="Видача" checked>
                <label for="type-expense">Видача</label>
                <input type="radio" name="type" id="type-income" value="Отримання">
                <label for="type-income">Отримання</label>
            </div>
            <input type="text" id="input-comment" placeholder="Опис">
            <input type="number" id="input-amount" placeholder="Сума" inputmode="decimal">
            <button id="btn-save" class="btn-primary">Зберегти</button>
        </div>

        <div class="recent-transactions">
            <h3>Останні операції</h3>
            <div class="list-header">
                <span>Дата</span>
                <span>Опис</span>
                <span class="text-right">Сума</span>
            </div>
            <ul id="recent-list"></ul>
            <button id="btn-details" class="btn-secondary">Детально</button>
        </div>
    </div>

    <div id="history" class="page">
        <h2>Історія</h2>
        <ul id="history-list"></ul>
        <button class="btn-secondary btn-back">Назад</button>
    </div>

    <div id="settings" class="page">
        <h2>Дані</h2>
        <div class="card">
            <h3>Імпорт з CSV</h3>
            <p class="hint">Оберіть файл для завантаження історії.</p>
            <input type="file" id="file-import" accept=".csv">
        </div>
        <div class="card">
            <h3>Видалити дані</h3>
            <button id="btn-clear" class="btn-danger">Очистити все</button>
        </div>
    </div>

    <nav class="tab-bar">
        <button class="tab-btn active" data-target="dashboard">Головна</button>
        <button class="tab-btn" data-target="history">Історія</button>
        <button class="tab-btn" data-target="settings">Дані</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
